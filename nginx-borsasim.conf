server {
    listen 80;
    server_name _;

    # Frontend dosyalarının bulunduğu dizin (Build edildikten sonra)
    # Bu yolu kendi sisteminize göre düzenleyin, örneğin: C:/BorsaSim/frontend/dist
    root C:/BorsaSim/frontend/dist;
    index index.html;

    # Uygulama kabuğu her deploy'da güncellenebilir; eski asset listesi cache'lenmesin.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hash'li dosyalar immutable'dır; eksik asset SPA index'ine düşmemeli.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Frontend Router ayarı (SPA için)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy - /api ile başlayan istekleri backend'e yönlendir
    location /api/ {
        # Backend portu 4000
        # Backend artık /api prefix'ini kabul ediyor.
        # Bu yüzden path'i olduğu gibi iletiyoruz (sondaki / kaldırıldı).
        proxy_pass http://127.0.0.1:4000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # IP adreslerini ilet
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO Proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
